[package]
name = "levilamina"
version = "26.20.5"
edition = "2021"
license = "Apache-2.0"
description = "Write LeviLamina mods for Minecraft Bedrock (server or client) in safe Rust. Targets BDS 1.26.20 / LeviLamina 26.20.4 (ABI v5)."
repository = "https://github.com/Maskviva/levilamina-rust-loader"
readme = "../../README.md"
keywords = ["levilamina", "minecraft", "bedrock", "mod", "bds"]
categories = ["game-development", "api-bindings"]

[package.metadata.minecraft]
bds_version = "1.26.20"
levilamina_version = "26.20.4"
abi_version = 5
lane_protocol = 1

[dependencies]
levilamina-sys = { version = "26.20.5", path = "../levilamina-sys", default-features = false }

[features]
default = ["server"]
server = ["levilamina-sys/server"]
client = ["levilamina-sys/client"]
more_dimensions = ["levilamina-sys/more_dimensions"]
